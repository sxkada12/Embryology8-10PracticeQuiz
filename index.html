<header><div class="in"><h1>Embryology Practice Exam: Digestive, Urinary &amp; Reproductive</h1>

<div class="card" id="final"><h2 id="fs"></h2><p id="fm"></p><button class="pri" onclick="location.reload()">Retake exam</button></div></main>
<script>
const D=[{"q": "Which kidney stage produces urine from about the 6th through 10th weeks, becomes nonfunctional by the second month, and has a duct that persists in the male reproductive tract?", "o": ["Ureteric bud", "Metanephros", "Mesonephros", "Pronephros"], "a": 2, "e": "The pronephros degenerates by week 4, the mesonephros (transitory kidney) functions weeks 6-10 and its duct persists in males, and the metanephros (permanent kidney) forms in week 5 and produces urine from about week 9.", "c": "U"}, {"q": "A newborn has clear fluid dribbling from the umbilicus that increases when the infant cries. Which structure failed to obliterate?", "o": ["Cloacal membrane", "Vitelline duct", "Lumen of the allantois (urachus)", "Urorectal septum"], "a": 2, "e": "A patent urachus (urachal fistula) is failure of the allantois to degenerate, connecting the bladder to the umbilicus. A patent vitelline duct would instead leak enteric contents.", "c": "U"}, {"q": "A patient has a catecholamine-secreting tumor of the adrenal medulla. From which embryonic tissue are these cells derived, and which cortical zone produces aldosterone?", "o": ["Mesoderm; zona reticularis", "Mesoderm; zona glomerulosa", "Neural crest; zona fasciculata", "Neural crest; zona glomerulosa"], "a": 3, "e": "The adrenal medulla derives from neural crest cells (chromaffin cells), the cortex from mesoderm. Zona glomerulosa = salt (aldosterone), fasciculata = sugar (cortisol), reticularis = sex (weak androgens).", "c": "R"}, {"q": "A cadaver dissection shows a fibrous cord running from the apex of the bladder to the umbilicus. Which structure does this represent and when does its lumen normally seal?", "o": ["Median umbilical ligament; around week 20", "Round ligament of the liver; around week 12", "Falciform ligament; around week 6", "Median umbilical ligament; around week 12"], "a": 3, "e": "Fetal urine initially drains through the allantois (urachus), which seals around week 12 and becomes the median umbilical ligament. Failure causes patent urachus or urachal cysts. The round ligament of the liver is the obliterated umbilical vein.", "c": "U"}, {"q": "An asymptomatic 40-year-old man is found incidentally on CT to have both kidneys on the right side, fused, with two ureters crossing the midline to enter the bladder normally. What is the most likely diagnosis?", "o": ["Pelvic kidney", "Crossed renal ectopia", "Horseshoe kidney", "Duplex collecting system"], "a": 1, "e": "Crossed renal ectopia (e.g., left kidney migrated to the right side) is usually asymptomatic and found incidentally. Horseshoe kidney has the kidneys fused across the midline at the inferior poles.", "c": "U"}, {"q": "A patient has ischemia of the distal third of the transverse colon, the descending colon, the sigmoid colon, and the upper rectum. Which artery supplies this region and from which embryonic gut segment is it derived?", "o": ["Inferior mesenteric artery; midgut", "Inferior mesenteric artery; hindgut", "Celiac trunk; foregut", "Superior mesenteric artery; midgut"], "a": 1, "e": "The hindgut (distal third of transverse colon through the anal canal above the pectinate line) is supplied by the IMA. The midgut (distal duodenum to proximal two-thirds of transverse colon) is supplied by the SMA; the foregut by the celiac trunk.", "c": "D"}, {"q": "A 4-week-old firstborn boy has nonbilious projectile vomiting after every feed. Visible gastric peristalsis is noted, and a firm, olive-shaped mass is palpated in the epigastrium. Which of the following is the underlying pathology?", "o": ["Hypertrophy of the pyloric smooth muscle", "A ring of pancreatic tissue encircling the second part of the duodenum", "Absence of ganglion cells in the myenteric plexus", "Failure of duodenal recanalization"], "a": 0, "e": "Hypertrophic pyloric stenosis is the most common cause of gastric outlet obstruction in infants, more common in males, presenting at 2-6 weeks with nonbilious projectile vomiting, visible peristalsis and an olive-like mass. Duodenal atresia would cause bilious vomiting.", "c": "D"}, {"q": "During cystoscopy, the smooth triangular area of the posterior bladder wall is examined. This region is derived from which embryonic structures?", "o": ["Urorectal septum", "Allantois", "Mesonephric ducts (and ureteric buds) incorporated into the posterior bladder wall", "Paramesonephric ducts"], "a": 2, "e": "As the bladder grows it incorporates the mesonephric ducts and ureteric buds, forming the trigone. The rest of the bladder arises from the urogenital sinus, with a contribution from the allantois.", "c": "U"}, {"q": "A newborn has vomiting and imaging shows narrowing of the descending (second) part of the duodenum, which is encircled by a band of pancreatic tissue. Which of the following is the most likely cause?", "o": ["Failure of the duodenal lumen to recanalize", "Persistence of the vitelline duct", "Failure of the ventral and dorsal pancreatic buds to fuse", "Abnormal rotation of the ventral pancreatic bud around the duodenum"], "a": 3, "e": "Annular pancreas results from abnormal rotation of the ventral pancreatic bud, forming a ring around the second part of the duodenum that may cause narrowing and vomiting.", "c": "D"}, {"q": "A newborn drools and coughs with the first feeding. A catheter cannot be passed into the stomach, yet an abdominal film shows gas in the stomach. The pregnancy was complicated by polyhydramnios. Which of the following best explains this condition?", "o": ["Failure of the lateral body folds to close", "Hypertrophy of the pyloric smooth muscle", "Improper division of the foregut by the tracheoesophageal septum", "Failure of the urorectal septum to partition the cloaca"], "a": 2, "e": "Tracheoesophageal fistula results from incomplete separation of the esophagus and trachea by the tracheoesophageal ridges/septum. It is usually accompanied by esophageal atresia, so the fetus cannot swallow amniotic fluid (polyhydramnios); the fistula lets air reach the stomach and gastric contents reflux into the lungs.", "c": "D"}, {"q": "A 46,XY infant has testes in the labia majora and female external genitalia. Serum testosterone and DHT levels are normal. There is no uterus. Which defect best explains this?", "o": ["5\u03b1-reductase deficiency", "Absence of M\u00fcllerian inhibiting substance", "21-hydroxylase deficiency", "Mutation of the androgen receptor"], "a": 3, "e": "Androgen insensitivity syndrome (testicular feminization), the most common 46,XY DSD, is due to an AR mutation: testosterone/DHT cannot act, so there is no virilization. 5\u03b1-reductase deficiency would show low DHT; absent MIS would leave a uterus.", "c": "R"}, {"q": "A 25-year-old woman with Turner syndrome is found on CT to have fused lower poles of the kidneys, crossing the midline anterior to the aorta, located low in the abdomen. Why did the kidneys remain low?", "o": ["The ureteric bud divided early", "Their ureteric buds failed to form", "The metanephric blastema was not induced", "Their ascent was blocked when the fused isthmus became trapped beneath the inferior mesenteric artery"], "a": 3, "e": "In horseshoe kidney the inferior poles fuse abnormally, and during ascent the kidneys are trapped under the IMA. It is associated with hydronephrosis, stones, infection, Turner syndrome and trisomies 13, 18 and 21.", "c": "U"}, {"q": "A prenatal ultrasound shows unilateral hydronephrosis with a normal-caliber ureter. Which site of obstruction and embryologic explanation is most likely?", "o": ["Ureterovesical junction, the last part of the ureter to canalize", "Ureteropelvic junction, the last part of the ureter to canalize", "Major calyces, due to failure of collecting tubule outgrowth", "Urethra, due to persistence of the urogenital membrane"], "a": 1, "e": "The ureteric bud recanalizes and is fully canalized by week 10, with the ureteropelvic junction canalizing last. It is the most common site of obstruction causing congenital hydronephrosis.", "c": "U"}, {"q": "Primordial germ cells are identified in the genital ridge of a 6-week embryo. Where and when were they first observed?", "o": ["In the neural crest at week 3", "In the wall of the yolk sac at week 4", "In the wall of the allantois at week 8", "In the surface epithelium of the genital ridge at week 2"], "a": 1, "e": "Primordial germ cells arise in the yolk sac wall at week 4 and migrate into the embryo, reaching the genital ridge by week 6, where they are surrounded by primitive sex cords.", "c": "R"}, {"q": "An ultrasound for a urinary tract infection in a 6-year-old boy shows an absent left kidney and ureter with a hypertrophied right kidney. What is the embryologic basis?", "o": ["The ureteric bud failed to develop and induce the metanephric mesenchyme", "The ureteropelvic junction failed to canalize", "The left kidney failed to ascend and remained in the pelvis", "The ureteric bud divided, forming a bifid ureter"], "a": 0, "e": "Unilateral renal agenesis is due to absence of the ureteric bud. Most patients are asymptomatic with compensatory hypertrophy of the other kidney, though contralateral anomalies are common.", "c": "U"}, {"q": "In the infant described with Potter sequence from bilateral renal agenesis, which mechanism most directly explains the cause of death?", "o": ["Aspiration through a tracheoesophageal fistula", "Uterine overdistension from polyhydramnios", "Renal failure from compensatory hypertrophy of the contralateral kidney", "Pulmonary hypoplasia from chest compression and lack of amniotic fluid aspiration into the fetal lungs"], "a": 3, "e": "Oligohydramnios compresses the fetus, and the lack of amniotic fluid aspiration impairs lung development, resulting in pulmonary hypoplasia, the cause of death. Polyhydramnios is the opposite fluid problem.", "c": "U"}, {"q": "A newborn with Down syndrome has not passed meconium in 48 hours and has a distended abdomen. Digital rectal examination reveals an empty rectal vault. Which of the following is the underlying defect?", "o": ["Persistence of the vitelline duct", "Failure of the colon to recanalize", "Failure of neural crest-derived ganglion cells to populate the myenteric and submucosal plexuses of the distal bowel", "Abnormal partitioning of the cloaca by the urorectal septum"], "a": 2, "e": "Hirschsprung disease is due to failure of neural crest-derived ganglion cells to descend into the distal bowel wall, causing a functional obstruction with proximal megacolon. It is associated with Down syndrome and is treated by resection.", "c": "D"}, {"q": "A 2-year-old boy is evaluated for a 2-inch outpouching of the ileum located approximately 2 feet from the ileocecal valve. Histology shows all three layers of the bowel wall and gastric mucosa within the lesion. Which embryologic structure failed to involute?", "o": ["Urachus (allantois)", "Primary intestinal loop", "Vitelline (omphalomesenteric) duct", "Dorsal mesentery"], "a": 2, "e": "Meckel diverticulum is a true diverticulum (all three layers) from persistence of the vitelline duct. The 'rule of 2s' and possible gastric or duodenal epithelium are classic features.", "c": "D"}, {"q": "A male newborn has no anal opening, and meconium is seen passing in the urine through the urethra. Which of the following best explains this finding?", "o": ["Abnormal development of the urorectal septum with the rectum opening into the urethra", "Failure of ganglion cells to migrate into the rectum", "Failure of the allantois to degenerate", "Failure of closure of the lateral body folds"], "a": 0, "e": "A urorectal fistula/anal atresia results from abnormal urorectal septum development. Anal atresia may be part of the VACTERL association (vertebral, anal, cardiac, tracheoesophageal fistula, esophageal atresia, renal/radial, limb).", "c": "D"}, {"q": "A 22-year-old man is tall with long extremities, small testes, gynecomastia and a history of developmental delay. Which karyotype and cytologic finding are expected?", "o": ["47,XXY with one Barr body", "46,XY with no Barr body", "45,X with no Barr body", "47,XXX with two Barr bodies"], "a": 0, "e": "Klinefelter syndrome is 47,XXY (trisomy; meiotic nondisjunction) with an inactivated X (Barr body), testicular atrophy, hypogonadism, gynecomastia and female hair distribution.", "c": "R"}, {"q": "A 3-day-old infant has bilious vomiting. Imaging shows small bowel clumped on the right side of the abdomen, and fibrous bands run from an abnormally positioned cecum to the peritoneum and liver, compressing the duodenum. Which complication should be most feared?", "o": ["Megacolon with perforation", "Urine leakage from the umbilicus", "Gastric outlet obstruction", "Midgut volvulus with bowel infarction"], "a": 3, "e": "This is malrotation of the midgut with Ladd's bands. The abnormal positioning predisposes the bowel to twisting around its mesentery (volvulus), causing obstruction and infarction.", "c": "D"}, {"q": "A 15-year-old girl has short stature, a shield chest, a webbed neck and primary amenorrhea. Blood pressure is higher in the arms than in the legs. Which findings are most likely?", "o": ["Streak ovaries and horseshoe kidney", "Normal ovaries and unilateral renal agenesis", "Atrophic testes and multicystic dysplastic kidney", "Ovotestes and pelvic kidney"], "a": 0, "e": "Turner syndrome (45,XO, no Barr body) causes ovarian dysgenesis (streak ovaries), amenorrhea, webbed neck from lymphatic defects, and cardiac defects (bicuspid aortic valve, coarctation) plus horseshoe kidney.", "c": "R"}, {"q": "An asymptomatic adult has a left kidney located near the pelvic brim with a short ureter on imaging. Which statement best describes this finding?", "o": ["A kidney with a divided ureteric bud", "Unilateral failure of the kidney to ascend, the most common form of renal ectopia", "Absence of the ureteric bud", "A kidney that crossed to the opposite side and fused with the other kidney"], "a": 1, "e": "Pelvic kidney is unilateral failure of ascent (kidneys normally ascend from the pelvis to the abdomen during weeks 6-9) and is the most common form of renal ectopia. Crossed renal ectopia involves crossing and fusion.", "c": "U"}, {"q": "A 28-year-old woman with recurrent pregnancy loss is found on hysterosalpingography to have two uterine horns with a single cervix. Which embryologic event failed?", "o": ["Regression of the mesonephric ducts", "Complete fusion of the paramesonephric (M\u00fcllerian) ducts", "Canalization of the vaginal plate", "Shortening of the gubernaculum"], "a": 1, "e": "Bicornuate uterus is due to incomplete fusion of the paramesonephric ducts, which normally form the uterine tubes, uterus and upper vagina in the female.", "c": "R"}, {"q": "A newborn boy has a painless, transilluminating scrotal swelling. Bowel is not present in the sac. What is the cause?", "o": ["Accumulation of serous fluid in a remnant of the processus vaginalis", "Failure of the testis to descend", "A patent processus vaginalis with bowel entering the scrotum", "Torsion of the spermatic cord"], "a": 0, "e": "Hydrocele is serous fluid within the spermatic cord/scrotum due to a remnant piece of the processus vaginalis. Bowel in the sac would be an indirect hernia.", "c": "R"}, {"q": "Which of the following structures is derived from the mesonephric (Wolffian) duct?", "o": ["Bulbourethral gland", "Prostate", "Uterine tube", "Seminal vesicle"], "a": 3, "e": "Mesonephric duct derivatives are the ureter (via the ureteric bud), efferent ducts, epididymis, vas deferens and seminal vesicle. The prostate and bulbourethral glands derive from the urethra, and the uterine tube from the paramesonephric duct.", "c": "R"}, {"q": "A newborn boy has the urethral meatus on the ventral surface of the penile shaft. Which of the following is the underlying cause?", "o": ["Failure of the genital tubercle to form", "Failure of the processus vaginalis to close", "Incomplete fusion of the urethral folds", "Persistence of the urachus"], "a": 2, "e": "Hypospadias results from incomplete fusion of the urethral folds, placing the meatus anywhere from the proximal glans to the perineum. It is the second most common congenital male reproductive abnormality, and incidence may be rising with environmental estrogens and antiandrogens.", "c": "R"}, {"q": "An 8-week fetus has intestinal loops located within the umbilical cord on ultrasound, a normal finding. Which statement correctly describes the normal timing and rotation of the midgut?", "o": ["It herniates in week 6 and returns in week 10 after a total of 270\u00b0 counterclockwise rotation around the superior mesenteric artery", "It herniates in week 10 and returns in week 14 after 180\u00b0 counterclockwise rotation around the celiac trunk", "It herniates in week 4 and returns in week 6 after 90\u00b0 clockwise rotation around the inferior mesenteric artery", "It herniates in week 6 and returns in week 10 after a total of 270\u00b0 clockwise rotation around the superior mesenteric artery"], "a": 0, "e": "The physiologic umbilical herniation begins in week 6 (90\u00b0 counterclockwise while herniated) and the loop returns at about week 10 with a further 180\u00b0, for 270\u00b0 counterclockwise in total around the SMA axis.", "c": "D"}, {"q": "A newborn has a midline mass at the umbilicus consisting of abdominal contents covered by a translucent membrane. Echocardiography reveals a ventricular septal defect, and karyotype shows trisomy 18. The membrane covering the mass is derived from which of the following?", "o": ["Yolk sac endoderm", "Skin and subcutaneous tissue of the abdominal wall", "Peritoneum and amnion of the umbilical cord", "Allantoic epithelium"], "a": 2, "e": "Omphalocele is herniation through the umbilicus with contents covered by peritoneum and amnion. It is associated with trisomies 13 and 18 and other structural anomalies (cardiac, neural tube), unlike gastroschisis.", "c": "D"}, {"q": "A newborn has loops of bowel protruding through a defect just to the right of an intact umbilical cord. There is no covering membrane over the bowel. Chromosomal analysis is normal. Which statement best describes this defect?", "o": ["The defect is associated with a poor prognosis because of coexisting cardiac and neural tube defects", "The extruded bowel is not covered by peritoneum or amnion, and the defect is not usually associated with chromosomal abnormalities", "The herniated bowel is contained within the base of the umbilical cord", "The extruded contents are covered by peritoneum and amnion and the defect is frequently associated with trisomy 18"], "a": 1, "e": "This is gastroschisis: a lateral-fold closure defect typically to the right of the umbilicus, with no sac, no association with chromosomal abnormalities, and a good prognosis. The other options describe omphalocele.", "c": "D"}, {"q": "A neonate has a unilateral nonfunctional kidney composed of cysts and connective tissue. Which of the following is correct regarding this condition?", "o": ["The mesonephric duct fails to degenerate, causing polyhydramnios", "The ureteric bud never forms, so the ureter is absent and the kidney is small and solid", "The ureteric bud fails to induce the metanephric blastema, and bilateral disease results in Potter sequence", "It is usually hereditary and most often bilateral"], "a": 2, "e": "Multicystic dysplastic kidney is predominantly nonhereditary and usually unilateral; failure of induction of the metanephric blastema leaves cysts and connective tissue. Bilateral disease would cause oligohydramnios and Potter sequence.", "c": "U"}, {"q": "A term newborn develops bilious vomiting within hours of the first feeding. Prenatal ultrasound showed polyhydramnios, and the infant has features of Down syndrome. An abdominal radiograph shows two air-filled bubbles in the upper abdomen separated by the pylorus. Which embryologic process most likely failed?", "o": ["Fusion of the ventral and dorsal pancreatic buds", "Recanalization of the duodenal lumen", "Return of the midgut loop to the abdominal cavity at week 10", "Separation of the trachea and esophagus by the tracheoesophageal ridges"], "a": 1, "e": "The 'double bubble' sign (stomach + proximal duodenum) with polyhydramnios, bilious vomiting and Down syndrome is duodenal atresia. The gut tube is transiently solid and must recanalize; failure causes atresia or stenosis.", "c": "D"}, {"q": "A newborn has low-set ears, a receding chin, a flattened nose, clubbed feet and severe respiratory distress. Prenatal ultrasound showed marked oligohydramnios. Autopsy shows absent kidneys and ureters. What is the primary embryologic failure?", "o": ["Failure of the kidneys to ascend from the pelvis", "Failure of the ureteric buds to form and induce the metanephric blastema", "Failure of the pronephros to degenerate", "Division of the ureteric bud"], "a": 1, "e": "Bilateral renal agenesis follows failure of ureteric bud formation. No fetal urine means oligohydramnios, fetal compression and the Potter sequence (Potter facies, limb deformities including clubfeet).", "c": "U"}, {"q": "Which of the following correctly describes partitioning of the cloaca?", "o": ["The urorectal septum divides it into the urogenital sinus (bladder and urethra) and the rectum/anal canal", "The septum transversum divides it into the bladder and the liver", "The cloacal membrane divides it into the allantois and vitelline duct", "The tracheoesophageal septum divides it into the bladder and rectum"], "a": 0, "e": "The cloaca is continuous ventrally with the allantois and dorsally with the hindgut. The mesodermal urorectal septum separates the urogenital sinus from the rectum and anal canal, and the cloacal membrane into urogenital and anal membranes.", "c": "U"}, {"q": "The indifferent gonad has primitive sex cords. Which statement correctly states their adult derivatives?", "o": ["Medullary cords form ductuli efferentes; cortical cords form uterine tubes", "Medullary cords form seminiferous tubules in the male; cortical cords form ovarian follicles in the female", "Medullary cords form the rete testis and vas deferens; cortical cords form the round ligament", "Medullary cords form ovarian follicles in the male; cortical cords form seminiferous tubules in the female"], "a": 1, "e": "In males the medullary (testis) cords form seminiferous tubules, with no cortical cords and a thick tunica albuginea. In females the medullary cords degenerate and cortical cords form ovarian follicles (primary oocytes plus follicular cells). Efferent ductules, rete testis and vas deferens are mesonephric-derived.", "c": "R"}, {"q": "A 6-week-old boy has an empty right hemiscrotum. In normal development the testis descends into the scrotum as the processus vaginalis evaginates and which structure shortens? What is a long-term risk if untreated?", "o": ["Vas deferens; Klinefelter syndrome", "Cranial suspensory ligament; indirect inguinal hernia", "Gubernaculum; hypospadias", "Gubernaculum; infertility and seminoma"], "a": 3, "e": "Cryptorchidism (about 1% of male infants, the most common congenital male reproductive abnormality) is failure of descent driven by the shortening gubernaculum. Many resolve spontaneously; otherwise orchiopexy before age 2. Complications include atrophy with infertility and increased seminoma risk.", "c": "R"}, {"q": "Which of the following adult renal structures is derived from the ureteric bud rather than the metanephric blastema?", "o": ["Proximal convoluted tubule", "Distal convoluted tubule", "Bowman capsule", "Collecting tubules"], "a": 3, "e": "The ureteric bud forms the ureter, renal pelvis, calyces and collecting tubules. It induces the metanephric blastema to form the nephron from Bowman capsule through the distal convoluted tubule.", "c": "U"}, {"q": "Which of the following correctly describes the fate of the external genital primordia in the female?", "o": ["Genital tubercle forms the scrotum, urethral folds form the clitoris, and genital swellings form the labia minora", "Genital tubercle forms the labia minora, urethral folds form the clitoris, and genital swellings form the labia majora", "Genital tubercle forms the clitoris, urethral folds form the labia minora, and genital swellings form the labia majora", "Genital tubercle forms the clitoris, urethral folds form the labia majora, and genital swellings form the labia minora"], "a": 2, "e": "In females: tubercle becomes the clitoris, urethral folds the labia minora, and labioscrotal swellings the labia majora. In males (under DHT): tubercle and urethral folds form the penis (with the ventral shaft/penile urethra) and the swellings become the scrotum.", "c": "R"}, {"q": "A 3-month-old boy has a groin bulge extending into the scrotum that enlarges with crying. It lies lateral to the inferior epigastric vessels. What is the embryologic cause?", "o": ["Failure of the processus vaginalis to close", "Accumulation of fluid in a closed remnant of the processus vaginalis", "Failure of the testis to descend", "Weakness of the abdominal wall medial to the inferior epigastric vessels"], "a": 0, "e": "Indirect inguinal hernia results from a patent processus vaginalis allowing abdominal contents into the scrotum; it is lateral to the inferior epigastric vessels (direct hernias are medial). A closed fluid-filled remnant is a hydrocele.", "c": "R"}, {"q": "During the 7th week the stomach rotates 90\u00b0 clockwise about its longitudinal axis (viewed from above). What is the resulting adult vagal innervation of the stomach?", "o": ["The right vagus innervates the anterior wall and the left vagus innervates the posterior wall", "The left vagus innervates the anterior wall and the right vagus innervates the posterior wall", "Both vagus nerves innervate the anterior wall equally", "The left vagus innervates the left half and the right vagus the right half of the stomach"], "a": 1, "e": "Clockwise rotation moves the original left side anteriorly, so the left vagus ends up on the anterior wall and the right vagus on the posterior wall. The greater curvature also forms from expansion of the posterior wall in weeks 4-5.", "c": "D"}, {"q": "A 30-year-old woman has recurrent episodes of abdominal pain and pancreatitis. MRCP shows that the dorsal and ventral pancreatic ducts do not communicate, producing two separate duct systems. This anomaly occurs in about 10% of the population. What is the embryologic basis?", "o": ["Failure of the ventral and dorsal pancreatic buds (and their ducts) to fuse", "Abnormal rotation of the ventral bud forming a ring around the duodenum", "Persistence of the omphalomesenteric duct", "Failure of the duodenum to recanalize"], "a": 0, "e": "Pancreatic divisum is a common anomaly in which the buds and ducts fail to fuse/anastomose. Most patients are asymptomatic but some develop chronic abdominal pain or pancreatitis.", "c": "D"}, {"q": "A 46,XX newborn has an enlarged clitoris and partially fused labia majora; ultrasound shows ovaries and a uterus. Which defect and consequence most likely explain this?", "o": ["21-hydroxylase deficiency causing decreased cortisol, increased ACTH and excess adrenal androgens", "5\u03b1-reductase deficiency causing inability to convert testosterone to DHT", "Deletion of SRY with absent M\u00fcllerian inhibiting substance", "Androgen receptor mutation causing inability to bind testosterone"], "a": 0, "e": "46,XX DSD is typically congenital adrenal hyperplasia from 21-hydroxylase (CYP21) deficiency: no cortisol feedback to the pituitary raises ACTH and adrenal androgens, virilizing the external genitalia while ovaries, uterus and oviducts are present.", "c": "R"}, {"q": "In a 46,XY fetus, which of the following correctly pairs a testicular hormone with its effect on internal genitalia?", "o": ["Estrogen from Leydig cells stimulates the paramesonephric ducts", "Testosterone from Sertoli cells suppresses the paramesonephric ducts", "M\u00fcller
